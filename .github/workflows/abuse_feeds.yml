name: Refresh abuse address-list fragments

on:
  schedule:
    - cron: "15 1 * * *" # daily, 01:15 UTC
  workflow_dispatch:

# The weekly full generator also writes generated files.  Never let the two
# workflows commit their outputs concurrently.
concurrency:
  group: generated-address-lists
  cancel-in-progress: false

permissions:
  contents: write

env:
  # RouterOS fetch output is parsed from a variable; keep parts below 30 KiB.
  MAX_ABUSE_ENTRIES_PER_FILE: 300

jobs:
  generate-abuse-rsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate CINS and Spamhaus DROP fragments
        run: |
          set -euo pipefail
          MAX="${{ env.MAX_ABUSE_ENTRIES_PER_FILE }}"
          OUTPUT_DIR="for_scripts/abusev4"
          mkdir -p "$OUTPUT_DIR"

          gen_addr() {
            local out="$1" comment="$2"
            shift 2
            {
              echo ":global AddressList"
              echo "/ip firewall address-list"
              for addr in "$@"; do
                echo "add list=\$AddressList comment=$comment address=$addr"
              done
            } > "$out"
          }

          write_parts() {
            local resource="$1" comment="$2" input="$3"
            mapfile -t entries < "$input"
            local count=${#entries[@]}
            [ "$count" -gt 0 ] || { echo "No entries for $resource" >&2; exit 1; }
            rm -f "$OUTPUT_DIR/${resource}.rsc" "$OUTPUT_DIR/${resource}_part"*.rsc "$OUTPUT_DIR/${resource}.parts" "$OUTPUT_DIR/${resource}.entries"
            local part=1 index=0
            while [ "$index" -lt "$count" ]; do
              gen_addr "$OUTPUT_DIR/${resource}_part${part}.rsc" "$comment" "${entries[@]:index:MAX}"
              index=$((index + MAX))
              part=$((part + 1))
            done
            printf '%s\n' "$((part - 1))" > "$OUTPUT_DIR/${resource}.parts"
            printf '%s\n' "$count" > "$OUTPUT_DIR/${resource}.entries"
          }

          curl --fail --silent --show-error --location \
            'https://cinsscore.com/list/ci-badguys.txt' -o cins.txt
          grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' cins.txt | sort -u | sed 's|$|/32|' > cins-ipv4.txt
          write_parts 'cins' 'cins' cins-ipv4.txt

          curl --fail --silent --show-error --location \
            'https://www.spamhaus.org/drop/drop_v4.json' -o spamhaus-drop.json
          jq -r '.cidr // empty' spamhaus-drop.json \
            | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$' \
            | sort -u > spamhaus-drop-ipv4.txt
          write_parts 'spamhaus-drop' 'spamhaus-drop' spamhaus-drop-ipv4.txt

      - name: Commit changed abuse fragments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add for_scripts/abusev4/
          if git diff --staged --quiet; then
            echo 'No abuse-feed changes'
            exit 0
          fi
          git commit -m 'Auto-update: abuse address-list fragments'
          git push
