name: Refresh Tor relay address-list fragments

on:
  schedule:
    # Four times a day, one hour before the router pulls at 03:40 UTC and
    # every six hours after that.
    - cron: "40 2,8,14,20 * * *"
  workflow_dispatch:

# The other generators write into the same tree.  Never let two workflows
# commit their outputs concurrently.
concurrency:
  group: generated-address-lists
  cancel-in-progress: false

permissions:
  contents: write

env:
  # RouterOS fetch output is parsed from a variable; keep parts below 30 KiB.
  # A Tor entry line is at most 92 characters, so 250 of them stay near 23 KiB.
  MAX_TOR_ENTRIES_PER_FILE: 250
  # The live consensus holds roughly 8000 running relays.  Refuse to publish a
  # suspiciously short list: a truncated fragment set would silently unblock
  # Tor on every router that loads it.
  MIN_TOR_ENTRIES: 4000

jobs:
  generate-tor-rsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Tor relay fragments
        run: |
          set -euo pipefail
          MAX="${{ env.MAX_TOR_ENTRIES_PER_FILE }}"
          MIN="${{ env.MIN_TOR_ENTRIES }}"
          OUTPUT_DIR="for_scripts/torv4"
          mkdir -p "$OUTPUT_DIR"

          gen_addr() {
            local out="$1" comment="$2"
            shift 2
            {
              echo ":global AddressList"
              echo "/ip firewall address-list"
              for addr in "$@"; do
                echo ":do { add dynamic=yes list=\$AddressList comment=$comment address=$addr } on-error={}"
              done
            } > "$out"
          }

          write_parts() {
            local resource="$1" comment="$2" input="$3"
            mapfile -t entries < "$input"
            local count=${#entries[@]}
            [ "$count" -gt 0 ] || { echo "No entries for $resource" >&2; exit 1; }
            rm -f "$OUTPUT_DIR/${resource}.rsc" "$OUTPUT_DIR/${resource}_part"*.rsc "$OUTPUT_DIR/${resource}.parts" "$OUTPUT_DIR/${resource}.entries"
            local part=1 index=0
            while [ "$index" -lt "$count" ]; do
              gen_addr "$OUTPUT_DIR/${resource}_part${part}.rsc" "$comment" "${entries[@]:index:MAX}"
              index=$((index + MAX))
              part=$((part + 1))
            done
            printf '%s\n' "$((part - 1))" > "$OUTPUT_DIR/${resource}.parts"
            printf '%s\n' "$count" > "$OUTPUT_DIR/${resource}.entries"
          }

          # Onionoo is the authoritative source and covers every running relay,
          # guard and middle included.  A client never dials an exit directly,
          # so an exit-only feed would not stop anybody from reaching Tor.
          # Its failure fails the job rather than publishing a partial list.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 10 \
            'https://onionoo.torproject.org/details?type=relay&running=true&fields=or_addresses' \
            -o onionoo.json
          jq -r '.relays[]? | .or_addresses[]?' onionoo.json \
            | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]+$' \
            | cut -d: -f1 > tor-or-addresses.txt

          # Supplementary only: the bulk exit list adds the handful of relays
          # that publish an exit address different from their OR address.
          if curl --fail --silent --show-error --location --retry 2 --retry-delay 5 \
            'https://check.torproject.org/torbulkexitlist' -o torbulkexitlist.txt; then
            grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' torbulkexitlist.txt > tor-exits.txt || true
          else
            echo 'Bulk exit list unavailable; continuing with Onionoo only' >&2
            : > tor-exits.txt
          fi

          # Supplementary only: the MetaCubeX geoip set is exit-heavy and almost
          # entirely covered by Onionoo, but it does carry a couple of hundred
          # addresses the other two feeds miss.  Its entries are already CIDR.
          if curl --fail --silent --show-error --location --retry 2 --retry-delay 5 \
            'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/tor.json' \
            -o metacubex-tor.json; then
            jq -r '.rules[]?.ip_cidr[]?' metacubex-tor.json \
              | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$' > tor-metacubex.txt || true
          else
            echo 'MetaCubeX geoip set unavailable; continuing without it' >&2
            : > tor-metacubex.txt
          fi

          {
            cat tor-or-addresses.txt tor-exits.txt \
              | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' \
              | sed 's|$|/32|'
            cat tor-metacubex.txt
          } | sort -u > tor-ipv4.txt

          total=$(wc -l < tor-ipv4.txt)
          echo "Collected $total Tor relay addresses"
          if [ "$total" -lt "$MIN" ]; then
            echo "Refusing to publish only $total entries; the floor is $MIN" >&2
            exit 1
          fi

          write_parts 'tor' 'tor' tor-ipv4.txt

      - name: Commit changed Tor fragments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add for_scripts/torv4/
          if git diff --staged --quiet; then
            echo 'No Tor relay changes'
            exit 0
          fi
          git commit -m 'Auto-update: Tor relay address-list fragments'
          git push
